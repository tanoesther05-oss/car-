{% load static %}<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion EMSP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="login-bg"><form class="login-card" method="post"><div class="brand-mark mb-3">E</div><h1>Connexion</h1><p>Administration du transport EMSP</p>{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Identifiant ou mot de passe incorrect.</div>{% endif %}{{ form.username.label_tag }}{{ form.username }}{{ form.password.label_tag }}{{ form.password }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="btn btn-primary w-100 mt-4">Se connecter</button></form><script>document.querySelectorAll('input').forEach(x=>x.classList.add('form-control','mb-3'))</script></body></html>
